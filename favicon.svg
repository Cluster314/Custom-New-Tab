<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040609" />
      <stop offset="100%" stop-color="#0d111a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Plate -->
  <rect width="100" height="100" rx="22" fill="url(#cyber-grad)" stroke="#40bfff" stroke-width="4" />
  
  <!-- Cyber Terminal Symbol (>_) -->
  <path d="M 28 35 L 45 50 L 28 65" fill="none" stroke="#40bfff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="53" y1="65" x2="72" y2="65" stroke="#40bfff" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
</svg>
