<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab // #40bfff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"Share Tech Mono"', 'monospace'],
                        orbitron: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            dark: '#040609',
                            panel: '#0d111a',
                            border: '#1a365d',
                            accent: '#40bfff',
                        }
                    },
                    boxShadow: {
                        'neon-accent': '0 0 15px rgba(64, 191, 255, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #040609;
            color: #94a3b8;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }
        .tech-border {
            position: relative;
            border: 1px solid rgba(64, 191, 255, 0.3);
            background: rgba(13, 17, 26, 0.85);
            backdrop-filter: blur(12px);
        }
        .tech-border::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 8px;
            height: 8px;
            border-top: 2px solid #40bfff;
            border-left: 2px solid #40bfff;
        }
        .tech-border::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 8px;
            height: 8px;
            border-bottom: 2px solid #40bfff;
            border-right: 2px solid #40bfff;
        }
        .glow-text-accent {
            text-shadow: 0 0 12px rgba(64, 191, 255, 0.7);
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #05070c;
        }
        ::-webkit-scrollbar-thumb {
            background: #40bfff;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative text-slate-300 selection:bg-[#40bfff] selection:text-black p-4 md:p-8">

    <div class="fixed inset-0 scanlines z-50 opacity-20"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[40rem] h-[40rem] bg-[#40bfff]/5 rounded-full blur-[160px] pointer-events-none"></div>

    <!-- Top minimal bar -->
    <header class="w-full max-w-4xl mx-auto flex items-center justify-between text-xs tracking-wider z-10">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-2 h-2 rounded-full bg-[#40bfff] animate-pulse shadow-[0_0_8px_#40bfff]"></span>
            <span id="system-date" class="text-slate-400">LOADING...</span>
        </div>
        <div>
            <button onclick="openAddShortcutModal()" class="px-3 py-1.5 rounded border border-[#40bfff]/40 text-[#40bfff] hover:bg-[#40bfff]/10 transition font-bold flex items-center space-x-1">
                <span>+ Add Shortcut</span>
            </button>
        </div>
    </header>

    <!-- Center Hub: Clock & Search -->
    <main class="w-full max-w-2xl mx-auto flex flex-col items-center space-y-8 z-10 my-auto">

        <!-- Clean Clock -->
        <div class="text-center">
            <div class="flex items-baseline justify-center space-x-2">
                <h1 id="live-clock" class="font-orbitron text-5xl sm:text-7xl font-black text-white tracking-wider glow-text-accent">00:00:00</h1>
                <span id="live-ampm" class="font-orbitron text-xl sm:text-2xl font-bold text-[#40bfff]">AM</span>
            </div>
        </div>

        <!-- Search Bar Module -->
        <div class="w-full tech-border rounded-xl p-3 shadow-lg">
            <form id="search-form" onsubmit="handleSearch(event)" class="flex flex-col sm:flex-row gap-2">
                <div class="relative flex items-center">
                    <select id="search-engine" class="bg-slate-900 border border-[#40bfff]/30 rounded-lg px-3 py-3 text-[#40bfff] font-mono text-xs focus:outline-none focus:border-[#40bfff] cursor-pointer">
                        <option value="google">Google</option>
                        <option value="duckduckgo">DuckDuckGo</option>
                        <option value="github">GitHub</option>
                        <option value="youtube">YouTube</option>
                    </select>
                </div>
                <div class="relative flex-1 flex items-center">
                    <span class="absolute left-3 text-[#40bfff] font-bold">&gt;</span>
                    <input type="text" id="search-input" autofocus autocomplete="off" placeholder="Search web or enter URL..." class="w-full bg-slate-900/90 border border-[#40bfff]/30 rounded-lg pl-8 pr-4 py-3 text-white placeholder-slate-500 font-mono text-sm focus:outline-none focus:border-[#40bfff] focus:shadow-[0_0_15px_rgba(64,191,255,0.4)] transition">
                </div>
                <button type="submit" class="bg-[#40bfff]/20 border border-[#40bfff] hover:bg-[#40bfff] hover:text-black text-[#40bfff] font-orbitron font-bold px-5 py-3 rounded-lg transition duration-200 text-xs tracking-wider">
                    SEARCH
                </button>
            </form>
        </div>

        <!-- Shortcuts Grid Container -->
        <div class="w-full">
            <div id="shortcuts-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <!-- Populated dynamically -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-4xl mx-auto text-center text-xs text-slate-600 tracking-widest z-10">
        NEW TAB // THEME: #40BFFF
    </footer>

    <!-- ADD SHORTCUT MODAL -->
    <div id="shortcut-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="tech-border bg-cyber-panel rounded-xl p-6 max-w-md w-full shadow-2xl">
            <h3 class="font-orbitron text-lg font-bold text-[#40bfff] mb-4">Add Shortcut</h3>
            <form id="add-shortcut-form" onsubmit="saveNewShortcut(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 uppercase">Title</label>
                    <input type="text" id="new-title" required placeholder="e.g. GitHub" class="w-full bg-slate-900 border border-[#40bfff]/30 rounded-lg px-3 py-2 text-white font-mono text-sm focus:outline-none focus:border-[#40bfff]">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 uppercase">URL</label>
                    <input type="url" id="new-url" required placeholder="https://github.com" class="w-full bg-slate-900 border border-[#40bfff]/30 rounded-lg px-3 py-2 text-white font-mono text-sm focus:outline-none focus:border-[#40bfff]">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeAddShortcutModal()" class="px-4 py-2 rounded border border-slate-700 text-slate-400 hover:bg-slate-800 transition text-xs font-bold">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded bg-[#40bfff] text-black font-bold hover:bg-[#2fa3e6] transition text-xs font-orbitron">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let shortcuts = JSON.parse(localStorage.getItem('tech_shortcuts_40bfff')) || [];

        function renderShortcuts() {
            const grid = document.getElementById('shortcuts-grid');
            grid.innerHTML = '';
            
            if (shortcuts.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-8 text-center border border-dashed border-[#40bfff]/20 rounded-xl bg-slate-900/40">
                        <p class="text-xs text-slate-500 mb-2 font-mono">No shortcuts configured.</p>
                        <button onclick="openAddShortcutModal()" class="text-xs text-[#40bfff] hover:underline font-bold">+ Add your first shortcut</button>
                    </div>
                `;
                return;
            }

            shortcuts.forEach((item, index) => {
                let hostname = item.url;
                try {
                    hostname = new URL(item.url).hostname;
                } catch(e) {}

                // Automatically grab the website's favicon using Google's public favicon service
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${hostname}&sz=64`;

                const card = document.createElement('a');
                card.href = item.url;
                card.className = "group tech-border rounded-lg p-3 flex items-center space-x-3 hover:border-[#40bfff] hover:shadow-[0_0_15px_rgba(64,191,255,0.3)] transition duration-200 bg-slate-900/60 relative overflow-hidden";
                card.innerHTML = `
                    <div class="w-9 h-9 flex items-center justify-center rounded bg-slate-900 border border-[#40bfff]/20 p-1.5 group-hover:scale-105 transition shrink-0">
                        <img src="${faviconUrl}" alt="" class="w-5 h-5 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                        <span class="hidden text-xs text-[#40bfff] font-bold">🌐</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-orbitron font-bold text-xs text-slate-200 truncate group-hover:text-[#40bfff] transition">${item.title}</div>
                        <div class="text-[10px] text-slate-500 truncate">${hostname}</div>
                    </div>
                    <button onclick="event.preventDefault(); deleteShortcut(${index})" title="Delete shortcut" class="absolute right-2 top-2 opacity-0 group-hover:opacity-100 text-pink-400 hover:text-pink-300 text-xs px-1.5 py-0.5 rounded transition">×</button>
                `;
                grid.appendChild(card);
            });
        }

        function deleteShortcut(index) {
            shortcuts.splice(index, 1);
            localStorage.setItem('tech_shortcuts_40bfff', JSON.stringify(shortcuts));
            renderShortcuts();
        }

        function openAddShortcutModal() {
            document.getElementById('shortcut-modal').classList.remove('hidden');
        }
        function closeAddShortcutModal() {
            document.getElementById('shortcut-modal').classList.add('hidden');
        }
        function saveNewShortcut(e) {
            e.preventDefault();
            const title = document.getElementById('new-title').value.trim();
            const url = document.getElementById('new-url').value.trim();
            
            shortcuts.push({ title, url });
            localStorage.setItem('tech_shortcuts_40bfff', JSON.stringify(shortcuts));
            renderShortcuts();
            closeAddShortcutModal();
            document.getElementById('add-shortcut-form').reset();
        }

        function handleSearch(e) {
            e.preventDefault();
            const engine = document.getElementById('search-engine').value;
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            if (query.startsWith('http://') || query.startsWith('https://') || (query.includes('.') && !query.includes(' '))) {
                const targetUrl = query.startsWith('http') ? query : 'https://' + query;
                window.location.href = targetUrl;
                return;
            }

            let searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            if (engine === 'duckduckgo') {
                searchUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
            } else if (engine === 'github') {
                searchUrl = `https://github.com/search?q=${encodeURIComponent(query)}`;
            } else if (engine === 'youtube') {
                searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
            }
            window.location.href = searchUrl;
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;

            const formattedHours = String(hours).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('live-clock').innerText = `${formattedHours}:${minutes}:${seconds}`;
            document.getElementById('live-ampm').innerText = ampm;

            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('system-date').innerText = now.toLocaleDateString('en-US', options).toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        renderShortcuts();
    </script>
</body>
</html>
